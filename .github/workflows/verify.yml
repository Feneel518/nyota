name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wedding
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wedding -d wedding"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .local && printf '%s' 'local-ci-only' > .local/postgres-password
      - run: node scripts/local-run.mjs migrate
      - run: pnpm lint
      - run: node scripts/local-run.mjs test
      - run: node scripts/local-run.mjs build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser verification
        run: |
          node scripts/local-run.mjs start > .local/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then break; fi
            sleep 1
          done
          node scripts/local-run.mjs e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            docs/screenshots/
          retention-days: 7
